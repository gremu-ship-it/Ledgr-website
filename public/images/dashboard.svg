<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1040" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Ledgr dashboard showing profit in Malawian Kwacha">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d9e75"/>
      <stop offset="1" stop-color="#0e4435"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d9e75"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="520" height="1040" rx="36" fill="#f8fafc"/>
  <!-- status -->
  <text x="36" y="52" font-size="22" font-weight="600" fill="#0c1f1a">9:41</text>
  <rect x="420" y="36" width="64" height="26" rx="8" fill="#e2e8f0"/>
  <rect x="426" y="41" width="40" height="16" rx="5" fill="#1d9e75"/>
  <!-- greeting -->
  <text x="36" y="118" font-size="22" fill="#64748b">Good morning 👋</text>
  <text x="36" y="156" font-size="32" font-weight="800" fill="#0c1f1a">Chikondi&#39;s Shop</text>
  <circle cx="466" cy="132" r="30" fill="#1d9e75"/>
  <text x="466" y="143" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">C</text>
  <!-- hero card -->
  <rect x="36" y="188" width="448" height="220" rx="28" fill="url(#hero)"/>
  <text x="68" y="240" font-size="20" fill="#a7f3d0">Net profit · August</text>
  <text x="68" y="300" font-size="56" font-weight="800" fill="#fff">MWK 4.25M</text>
  <rect x="68" y="330" width="170" height="44" rx="22" fill="#ffffff" opacity="0.2"/>
  <text x="153" y="360" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">▲ 18% vs Jul</text>
  <!-- income / expenses -->
  <rect x="36" y="432" width="216" height="150" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="64" y="472" font-size="19" fill="#64748b">Income</text>
  <text x="64" y="512" font-size="33" font-weight="800" fill="#0c1f1a">MWK 6.1M</text>
  <text x="64" y="548" font-size="20" font-weight="700" fill="#1d9e75">▲ 12%</text>
  <rect x="268" y="432" width="216" height="150" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="296" y="472" font-size="19" fill="#64748b">Expenses</text>
  <text x="296" y="512" font-size="33" font-weight="800" fill="#0c1f1a">MWK 1.9M</text>
  <text x="296" y="548" font-size="20" font-weight="700" fill="#dc2626">▼ 4%</text>
  <!-- cash flow -->
  <text x="36" y="632" font-size="24" font-weight="800" fill="#0c1f1a">Cash flow</text>
  <text x="484" y="632" font-size="19" fill="#1d9e75" text-anchor="end" font-weight="600">Report →</text>
  <rect x="36" y="652" width="448" height="170" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <g>
    <rect x="76" y="750" width="36" height="40" rx="8" fill="url(#bar)"/>
    <rect x="128" y="722" width="36" height="68" rx="8" fill="url(#bar)"/>
    <rect x="180" y="738" width="36" height="52" rx="8" fill="url(#bar)"/>
    <rect x="232" y="700" width="36" height="90" rx="8" fill="url(#bar)"/>
    <rect x="284" y="716" width="36" height="74" rx="8" fill="url(#bar)"/>
    <rect x="336" y="688" width="36" height="102" rx="8" fill="url(#bar)"/>
    <rect x="388" y="708" width="36" height="82" rx="8" fill="url(#bar)"/>
  </g>
  <!-- recent -->
  <text x="36" y="872" font-size="24" font-weight="800" fill="#0c1f1a">Recent</text>
  <rect x="36" y="892" width="448" height="112" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="84" cy="948" r="26" fill="#dcfce7"/>
  <text x="84" y="957" font-size="24" text-anchor="middle">🧾</text>
  <text x="124" y="940" font-size="21" font-weight="700" fill="#0c1f1a">INV-0241 · Acme Ltd</text>
  <text x="124" y="968" font-size="19" fill="#64748b">Today · Paid</text>
  <text x="452" y="956" font-size="22" font-weight="800" fill="#1d9e75" text-anchor="end">+850K</text>
</svg>
