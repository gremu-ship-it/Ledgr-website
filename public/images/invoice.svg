<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1040" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Ledgr VAT invoice">
  <defs>
    <linearGradient id="invhero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1f1a"/>
      <stop offset="1" stop-color="#0e4435"/>
    </linearGradient>
  </defs>
  <rect width="520" height="1040" rx="36" fill="#f8fafc"/>
  <text x="36" y="52" font-size="22" font-weight="600" fill="#0c1f1a">9:41</text>
  <rect x="420" y="36" width="64" height="26" rx="8" fill="#e2e8f0"/>
  <rect x="426" y="41" width="40" height="16" rx="5" fill="#1d9e75"/>
  <!-- header -->
  <rect x="36" y="84" width="448" height="150" rx="28" fill="url(#invhero)"/>
  <text x="68" y="134" font-size="20" font-weight="700" fill="#6ee7b7" letter-spacing="2">TAX INVOICE</text>
  <text x="68" y="176" font-size="30" font-weight="800" fill="#fff">INV-0241</text>
  <text x="452" y="176" font-size="20" fill="#cbd5e1" text-anchor="end">10 Sep 2026</text>
  <text x="68" y="206" font-size="19" fill="#cbd5e1">TPIN: 12345678 · VAT registered</text>
  <!-- parties -->
  <rect x="36" y="254" width="448" height="130" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="68" y="296" font-size="18" fill="#64748b">FROM</text>
  <text x="68" y="326" font-size="23" font-weight="800" fill="#0c1f1a">Chikondi&#39;s Shop</text>
  <text x="68" y="354" font-size="19" fill="#64748b">Lilongwe · 0999 123 456</text>
  <text x="300" y="296" font-size="18" fill="#64748b">BILLED TO</text>
  <text x="300" y="326" font-size="23" font-weight="800" fill="#0c1f1a">Acme Ltd</text>
  <text x="300" y="354" font-size="19" fill="#64748b">Blantyre</text>
  <!-- lines -->
  <rect x="36" y="404" width="448" height="330" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="68" y="448" font-size="18" font-weight="700" fill="#64748b">DESCRIPTION</text>
  <text x="452" y="448" font-size="18" font-weight="700" fill="#64748b" text-anchor="end">AMOUNT</text>
  <line x1="68" y1="466" x2="452" y2="466" stroke="#e2e8f0" stroke-width="2"/>
  <text x="68" y="502" font-size="21" font-weight="600" fill="#0c1f1a">Rice 50kg × 10</text>
  <text x="452" y="502" font-size="21" fill="#0c1f1a" text-anchor="end">480,000</text>
  <text x="68" y="534" font-size="18" fill="#64748b">excl. VAT</text>
  <text x="68" y="574" font-size="21" font-weight="600" fill="#0c1f1a">Cooking oil 20L × 5</text>
  <text x="452" y="574" font-size="21" fill="#0c1f1a" text-anchor="end">243,404</text>
  <text x="68" y="606" font-size="18" fill="#64748b">excl. VAT</text>
  <line x1="68" y1="630" x2="452" y2="630" stroke="#e2e8f0" stroke-width="2"/>
  <text x="68" y="662" font-size="20" fill="#64748b">Subtotal</text>
  <text x="452" y="662" font-size="20" fill="#0c1f1a" text-anchor="end">723,404</text>
  <text x="68" y="696" font-size="20" fill="#64748b">VAT 17.5%</text>
  <text x="452" y="696" font-size="20" fill="#0c1f1a" text-anchor="end">126,596</text>
  <!-- total -->
  <rect x="36" y="754" width="448" height="110" rx="24" fill="#1d9e75"/>
  <text x="68" y="800" font-size="22" font-weight="700" fill="#d1fae5">TOTAL (MWK)</text>
  <text x="452" y="820" font-size="44" font-weight="800" fill="#fff" text-anchor="end">850,000</text>
  <!-- paid stamp -->
  <g transform="rotate(-8 400 560)">
    <rect x="316" y="524" width="150" height="56" rx="12" fill="none" stroke="#1d9e75" stroke-width="4"/>
    <text x="391" y="562" font-size="30" font-weight="800" fill="#1d9e75" text-anchor="middle" letter-spacing="3">PAID</text>
  </g>
  <text x="260" y="920" font-size="19" fill="#64748b" text-anchor="middle">Due in 14 days · Bank / Airtel Money / Mpamba</text>
  <rect x="36" y="946" width="448" height="58" rx="16" fill="#0c1f1a"/>
  <text x="260" y="983" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">⬇ Download PDF</text>
</svg>
